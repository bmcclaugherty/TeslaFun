<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <a href="../../index.html" class="back-button">← Back</a>
                <h1>2048</h1>
                <div class="score-container">
                    <div class="score-box">
                        <div class="score-label">SCORE</div>
                        <div id="score">0</div>
                    </div>
                    <div class="score-box">
                        <div class="score-label">BEST</div>
                        <div id="best-score">0</div>
                    </div>
                </div>
            </div>
            <p>Join the numbers and get to the <strong>2048 tile!</strong></p>
        </header>

        <main>
            <div class="game-container">
                <div class="grid-container" id="grid-container">
                    <!-- Grid cells will be generated by JS -->
                </div>
                <div class="tile-container" id="tile-container">
                    <!-- Tiles will be generated by JS -->
                </div>
                <div class="game-message" id="game-message">
                    <p></p>
                    <button class="retry-button" id="retry-button">Try again</button>
                </div>
            </div>

            <div class="controls-hint">
                <p><strong>How to play:</strong> Use your <strong>arrow keys</strong> or <strong>swipe</strong> to move the tiles.</p>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
