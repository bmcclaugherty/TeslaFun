<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Memory Match</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <a href="../../index.html" class="back-button">← Back</a>
                <h1>Memory Match</h1>
                <div class="stats">
                    <div class="stat-box">
                        <div class="stat-label">MOVES</div>
                        <div id="moves">0</div>
                    </div>
                </div>
            </div>
            <p>Find all the matching pairs!</p>
        </header>

        <main>
            <div class="game-board" id="game-board">
                <!-- Cards generated by JS -->
            </div>

            <div class="controls">
                <button class="reset-button" id="reset-button">Restart Game</button>
            </div>
        </main>
    </div>

    <div class="modal" id="game-over-modal">
        <div class="modal-content">
            <h2>You Won!</h2>
            <p>Completed in <span id="final-moves">0</span> moves.</p>
            <button class="reset-button" id="play-again-button">Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
