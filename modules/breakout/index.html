<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Breakout</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <a href="../../index.html" class="back-button">← Back</a>
                <h1>Breakout</h1>
                <div class="score-display">
                    Score: <span id="score">0</span>
                </div>
            </div>
        </header>

        <main>
            <div class="game-container">
                <canvas id="gameCanvas" width="800" height="600"></canvas>
                <div id="start-screen" class="overlay">
                    <h2>Tap to Start</h2>
                </div>
                <div id="game-over-screen" class="overlay hidden">
                    <h2>Game Over</h2>
                    <p>Final Score: <span id="final-score">0</span></p>
                    <button id="restart-button" class="action-button">Play Again</button>
                </div>
            </div>
            <div class="controls-hint">
                <p>Drag your finger or use arrow keys to move the paddle!</p>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
